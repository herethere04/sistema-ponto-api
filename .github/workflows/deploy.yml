name: Build e Deploy - Sistema Ponto

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: "acrsistemapontoab"
  CONTAINER_APP_NAME: "app-sistema-ponto-api-ab"
  RESOURCE_GROUP: "rg-sistema-ponto"
  IMAGE_NAME: "sistemaponto-api"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar Código
        uses: actions/checkout@v4

      - name: 🔑 Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🐳 Login no Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🏗️ Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          file: Dockerfile

      - name: 🚀 Deploy no Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: ${{ env.AZURE_CONTAINER_REGISTRY }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          targetPort: 8080
          
          # AQUI ESTÃO AS VARIÁVEIS DE PRODUÇÃO
          environmentVariables: |
            ConnectionStrings__DefaultConnection=Host=app-sistema-ponto-db;Port=5432;Database=sistemaponto;Username=pontouser;Password=pontopass
            JwtSettings__Secret=UmaChaveMuitoSecretaParaAssinarOsTokens123!