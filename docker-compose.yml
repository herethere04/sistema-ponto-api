version: '3.4'

services:
  # Serviço da nossa API .NET
  api:
    container_name: sistema-ponto-api-react
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # 1. Conecta no container 'db' (não localhost)
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=sistemaponto;Username=pontouser;Password=pontopass
      # 2. Senha para o Token (sem isso a API não liga)
      - JwtSettings__Secret=UmaChaveMuitoSecretaParaAssinarOsTokens123!
    depends_on:
      - db

  # Serviço do Banco de Dados PostgreSQL
  db:
    container_name: sistema-ponto-db-react
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pontouser
      - POSTGRES_PASSWORD=pontopass
      - POSTGRES_DB=sistemaponto
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: